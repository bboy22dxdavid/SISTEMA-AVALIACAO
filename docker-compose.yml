name: sistema-avaliacao

services:
  postgres:
    image: postgres:16-alpine
    container_name: avaliacao-sang
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sang_db}
      POSTGRES_USER: ${POSTGRES_USER:-sang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sang}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sang_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sang} -d ${POSTGRES_DB:-sang_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sang-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sang-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15432:80"
    depends_on:
      - postgres
    networks:
      - sang-network
    

  openldap:
    image: osixia/openldap:1.5.0
    container_name: sang-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Forca Aerea Brasileira - SANG"
      LDAP_DOMAIN: "fab.mil.br"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-admin}"
      LDAP_TLS: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - sang_ldap_data:/var/lib/ldap
      - sang_ldap_config:/etc/ldap/slapd.d
    networks:
      - sang-network

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: sang-phpldapadmin
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8088:80"
    depends_on:
      - openldap
    networks:
      - sang-network

networks:
  sang-network:
    driver: bridge

volumes:
  sang_pgdata:
  sang_ldap_data:
  sang_ldap_config:
