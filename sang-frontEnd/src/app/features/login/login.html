<div class="login-container">
  <mat-card class="login-card">
    <div class="header-centralizado">
      <div class="icone-wrapper">
        <mat-icon class="icone-primario">person</mat-icon>
      </div>
      <h2 class="titulo-primario">SANG</h2>
      <p class="subtitulo-login">Sistema de Avaliação e Nivelamento de Graduados</p>
    </div>

    <mat-divider class="divisor-sutil"></mat-divider>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="entrar()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuário (Username)</mat-label>
          <input matInput formControlName="username" placeholder="Ex: cap.mendes" />
          <mat-icon matSuffix class="icone-input">person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput [type]="esconderSenha ? 'password' : 'text'" formControlName="password" />
          <button mat-icon-button matSuffix type="button" (click)="esconderSenha = !esconderSenha">
            <mat-icon class="icone-input">{{ esconderSenha ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button type="submit" class="full-width btn-entrar" [disabled]="loginForm.invalid || carregando">
          {{ carregando ? 'Autenticando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="acoes-rodape">
      <a mat-button routerLink="/usuarios/novo" class="link-cadastro">
        Cadastrar novo avaliador/revisor
      </a>
    </mat-card-actions>
  </mat-card>
</div>
